name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::http::Timeout=30 -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
      - name: Run tests
        working-directory: gateway
        run: go test ./... -timeout 120s

  publish:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Uses the workflow's own GITHUB_TOKEN, not a PAT. The previous GHCR_PAT
      # (classic, write:packages) expired 2026-08-28 and silently stopped image
      # publishing. It is deliberately not replaced: GitHub's UI now force-selects
      # `repo` alongside `write:packages`, so any replacement classic PAT could read
      # every private repo, including diction-dev. GITHUB_TOKEN is scoped to this
      # repo and this run, and `packages: write` above is all it needs for
      # ghcr.io/dictionlabs. See ~/network/GITHUB.md on Din.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: dictionlabs
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          # The legacy ghcr.io/omachala/diction-gateway ref is NOT built here.
          # GITHUB_TOKEN is scoped to this repo's org (DictionLabs) and cannot push
          # to a personal namespace, and GHCR accepts no fine-grained token that
          # could be scoped to packages alone. That ref is mirrored out-of-band by
          # ~/scripts/diction-image-mirror.sh on Din instead, so old installs keep
          # receiving identical images without CI holding a broad classic PAT.
          images: |
            docker.io/dictionlabs/gateway
            ghcr.io/dictionlabs/gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # VERSION feeds core.Version, which GET /health reports and the app uses for its
          # self-hosted "your gateway is behind" notice. github.ref_name is the tag (v13.0);
          # the app strips the leading v. Without this every published image reports "dev"
          # and the notice can never fire for anyone.
          build-args: |
            IMAGE_REF=ghcr.io/dictionlabs/gateway:${{ github.ref_name }}
            VERSION=${{ github.ref_name }}

  release:
    name: Create GitHub Release
    needs: [test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker

            ```bash
            docker pull dictionlabs/gateway:${{ github.ref_name }}
            # also available at ghcr.io/dictionlabs/gateway and ghcr.io/omachala/diction-gateway (identical images)
            ```

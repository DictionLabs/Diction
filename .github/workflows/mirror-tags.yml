name: Mirror Gateway Tags

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated git tags to mirror from ghcr.io/omachala/diction-gateway"
        required: true
        default: "v1.2.0 v6.0 v6.1 v6.2 v7.0 v8.0 v9.0 v10.0 v10.1 v11.0 latest"

jobs:
  mirror:
    name: Copy existing images to dictionlabs namespaces
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: dictionlabs
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy each tag to both new namespaces
        run: |
          set -euo pipefail
          for tag in ${{ github.event.inputs.tags }}; do
            echo "::group::$tag"
            docker buildx imagetools create \
              --tag ghcr.io/dictionlabs/gateway:"$tag" \
              --tag dictionlabs/gateway:"$tag" \
              ghcr.io/omachala/diction-gateway:"$tag"
            echo "::endgroup::"
          done

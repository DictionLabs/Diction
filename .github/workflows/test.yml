name: Gateway Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint, checks, tests & coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install golangci-lint and govulncheck
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Gateway gate (lint, comments, function and file length, private references, vulnerabilities, coverage 90)
        env:
          COVERPROFILE: ${{ github.workspace }}/gateway/coverage.txt
        run: scripts/hygiene/check.sh gateway

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: gateway/coverage.txt
          flags: gateway

name: Build & Publish Gateway

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: dictionlabs
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            docker.io/dictionlabs/gateway
            ghcr.io/dictionlabs/gateway
            ghcr.io/omachala/diction-gateway
          # sha only. This workflow builds untagged images from a manual dispatch, so it
          # cannot know a version -- core.Version stays "dev" and /health reports "dev",
          # which is the correct "no opinion" answer for an untagged build.
          #
          # `latest` deliberately does NOT live here. It is what most self-hosters actually
          # run, and publishing it from both workflows meant a dispatch after a release
          # silently moved `latest` back onto a versionless image, undoing the version
          # reporting with no signal. `latest` belongs to release.yml, which knows the tag.
          tags: |
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IMAGE_REF=ghcr.io/dictionlabs/gateway:sha-${{ github.sha }}

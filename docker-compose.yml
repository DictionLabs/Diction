# Diction self-hosted stack.
#
# Two ways to run transcription:
#
#   1. Gateway + speech engine (recommended)
#      Pick a profile and start: docker compose --profile <profile> up -d
#      Point the Diction app at http://<host>:8080
#      Streaming over WebSocket. Words come back while you're still talking.
#
#   2. Whisper only (simplest)
#      Add `ports: ["8000:8000"]` to one of the whisper services and point the
#      Diction app straight at http://<host>:8000. No gateway needed.
#      Works via the app's HTTP fallback path. No streaming, so longer
#      dictations have a visible wait after you tap stop.
#
# Pick a profile (user always picks one explicitly):
#   docker compose --profile small up -d
#   docker compose --profile medium up -d
#   docker compose --profile large up -d
#   docker compose --profile parakeet up -d
#
# Set DEFAULT_MODEL on the gateway to match your chosen profile:
#   small     → DEFAULT_MODEL: small
#   medium    → DEFAULT_MODEL: medium
#   large     → DEFAULT_MODEL: large-v3-turbo
#   parakeet  → DEFAULT_MODEL: parakeet-v3
#
# Gateway endpoints:
#   POST /v1/audio/transcriptions   transcribe uploaded audio
#   WS   /v1/audio/stream           stream audio in real time
#   GET  /v1/models                 list available models
#   GET  /health                    health check

services:

  gateway:
    image: dictionlabs/gateway:latest
    container_name: diction-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DEFAULT_MODEL: small
      # --- AI Enhancement (BYO LLM) ---
      # Uncomment and configure to enable AI transcript cleanup.
      # Works with OpenAI, Groq, Ollama, or any OpenAI-compatible provider.
      # See README for setup guide and model recommendations.
      # LLM_BASE_URL: https://api.openai.com/v1
      # LLM_API_KEY: sk-...
      # LLM_MODEL: gpt-4o-mini
      # LLM_PROMPT: "You are a transcript cleaner. Fix grammar, remove filler words (um, uh, er), and correct STT errors. Return only the cleaned text."
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The whisper server runs as uid 1000, but a volume left by the old root-based
  # faster-whisper-server images is owned by root, so after an upgrade the server cannot
  # write and every model download fails with EACCES. This one-shot service fixes ownership
  # before the server starts. No-op on a fresh install and on every later run.
  whisper-models-init:
    image: dictionlabs/whisper-server:latest-cpu
    container_name: diction-whisper-models-init
    user: root
    profiles: ["small", "medium", "large"]
    volumes:
      - whisper-models:/cache
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /cache"]
    restart: "no"

  whisper-small:
    image: dictionlabs/whisper-server:latest-cpu
    container_name: diction-whisper-small
    restart: unless-stopped
    profiles: ["small"]
    depends_on:
      whisper-models-init:
        condition: service_completed_successfully
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Speaches never downloads a model on demand: a request for one it does not have returns
  # "not installed locally" rather than fetching it, and the gateway does not implement model
  # download either. Without this a fresh stack starts clean then fails every transcription.
  # One-shot and idempotent; exits as soon as the model is on disk.
  whisper-small-pull:
    image: dictionlabs/whisper-server:latest-cpu
    container_name: diction-whisper-small-pull
    profiles: ["small"]
    depends_on:
      whisper-small:
        condition: service_healthy
    entrypoint: ["curl", "-fsS", "-X", "POST", "http://whisper-small:8000/v1/models/DictionLabs/whisper-small-ct2"]
    restart: "no"

  whisper-medium:
    image: dictionlabs/whisper-server:latest-cpu
    container_name: diction-whisper-medium
    restart: unless-stopped
    profiles: ["medium"]
    depends_on:
      whisper-models-init:
        condition: service_completed_successfully
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Speaches never downloads a model on demand: a request for one it does not have returns
  # "not installed locally" rather than fetching it, and the gateway does not implement model
  # download either. Without this a fresh stack starts clean then fails every transcription.
  # One-shot and idempotent; exits as soon as the model is on disk.
  whisper-medium-pull:
    image: dictionlabs/whisper-server:latest-cpu
    container_name: diction-whisper-medium-pull
    profiles: ["medium"]
    depends_on:
      whisper-medium:
        condition: service_healthy
    entrypoint: ["curl", "-fsS", "-X", "POST", "http://whisper-medium:8000/v1/models/DictionLabs/whisper-medium-ct2"]
    restart: "no"

  whisper-large-turbo:
    image: dictionlabs/whisper-server:latest-cpu
    container_name: diction-whisper-large-turbo
    restart: unless-stopped
    profiles: ["large"]
    depends_on:
      whisper-models-init:
        condition: service_completed_successfully
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Speaches never downloads a model on demand: a request for one it does not have returns
  # "not installed locally" rather than fetching it, and the gateway does not implement model
  # download either. Without this a fresh stack starts clean then fails every transcription.
  # One-shot and idempotent; exits as soon as the model is on disk.
  whisper-large-turbo-pull:
    image: dictionlabs/whisper-server:latest-cpu
    container_name: diction-whisper-large-turbo-pull
    profiles: ["large"]
    depends_on:
      whisper-large-turbo:
        condition: service_healthy
    entrypoint: ["curl", "-fsS", "-X", "POST", "http://whisper-large-turbo:8000/v1/models/DictionLabs/whisper-large-v3-turbo-ct2"]
    restart: "no"

  parakeet:
    image: dictionlabs/parakeet:latest-int8
    container_name: diction-parakeet
    restart: unless-stopped
    profiles: ["parakeet"]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5092"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama
    container_name: diction-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  whisper-models:
    name: diction-whisper-models
  ollama-data:
    name: diction-ollama-data
